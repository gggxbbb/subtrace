# 构建并分发多架构镜像到 ghcr.io（ADR-0005 单实例部署）。
# 通道：main 分支 → :dev / :dev-<sha>；v*.*.* 标签 → :latest / :<版本> / :<主.次> / :<主>。
# Matrix 按架构分别构建（push-by-digest），merge 阶段组装多架构 manifest。

name: docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/subtrace

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 按架构构建并按 digest 推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # 版本戳：镜像构建上下文无 .git，hash 由 build-arg 注入（next.config 截短显示）
          build-args: |
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算标签
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            MAJOR="${V%%.*}"
            MINOR="$(echo "$V" | cut -d. -f1-2)"
            echo "tags=${IMAGE}:latest ${IMAGE}:${V} ${IMAGE}:${MINOR} ${IMAGE}:${MAJOR}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:dev ${IMAGE}:dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 组装多架构 manifest
        working-directory: /tmp/digests
        run: |
          ARGS=""
          for t in ${{ steps.tags.outputs.tags }}; do ARGS="$ARGS -t $t"; done
          SOURCES=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create $ARGS $SOURCES
